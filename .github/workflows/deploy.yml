name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Build
        run: bun run build
        env:
          VITE_WS_URL: wss://pistasjug.ar/terrateniente/ws

      # One curl tells whether live == main.
      - name: Stamp the deploy
        run: echo "{\"commit\":\"${GITHUB_SHA::7}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > dist/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The room server: the droplet pulls main and rebuilds its image (seconds,
  # only changed layers). Skipped, with a warning, until the DEPLOY_SSH_KEY secret exists; see
  # deploy/README.md. The key is pinned to one forced command on the droplet.
  server:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Warn when the room server cannot deploy
        if: env.DEPLOY_SSH_KEY == ''
        run: |
          echo "::warning::DEPLOY_SSH_KEY is not set: the room server was NOT deployed, so Pages and the server are on different builds."

      - name: Deploy room server
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$DEPLOY_SSH_KEY" > ~/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/known_hosts
          ssh -i ~/deploy_key -o UserKnownHostsFile=~/known_hosts root@167.172.140.176 deploy
          # The new container takes a moment to listen; Caddy answers 502 until then.
          curl -sf --retry 15 --retry-delay 2 --retry-all-errors https://pistasjug.ar/terrateniente/health
